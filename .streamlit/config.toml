[theme]
primaryColor = "#B85532"
backgroundColor = "#F7F4EE"
secondaryBackgroundColor = "#FDFBF7"
textColor = "#2A2723"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[server]
headless = true
maxUploadSize = 200
enableCORS = true
fileWatcherType = "none"
